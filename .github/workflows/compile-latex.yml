name: Compile LaTeX Document

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_pdflatex: true

      - name: Upload Compiled PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiAgent_GenAI_IEEE_Paper
          path: main.pdf

      - name: Release Latest PDF (on push to main)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Compiled Paper (PDF)"
          body: "Automated PDF build from commit ${{ github.sha }}."
          files: main.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
